<style>
:root{
  --navy:#1D2B53; --sun:#FFC93C; --sky:#8FD3F4; --paper:#FFFDF4;
  --left:#4DB6F0; --right:#FF9F43;
  --forest:#56B26A; --city:#6F8FC9; --grass:#E0A63A; --p1:#FF9EB5; --p2:#B79CFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--sky);color:var(--navy);
  font-family:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif}
body{position:fixed;inset:0}
#three{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:inherit;color:var(--navy);touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:none;justify-content:center;gap:10px;pointer-events:none;padding:0 80px}
#hud.show{display:flex}
.pill{background:var(--paper);border:3px solid var(--navy);border-radius:999px;padding:6px 16px;font-size:20px;font-weight:700;white-space:nowrap}
.corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);height:52px;border-radius:14px;border:3px solid var(--navy);background:var(--paper);font-size:18px;font-weight:700;display:none}
.corner.show{display:block}
#btnQuit{left:calc(env(safe-area-inset-left,0px) + 12px);min-width:64px}
#btnHelp{right:calc(env(safe-area-inset-right,0px) + 12px);width:52px;font-size:28px;border-radius:50%}

/* 糸ボタン */
.ito{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:150px;height:150px;border-radius:50%;border:5px solid var(--navy);
  box-shadow:0 7px 0 var(--navy);font-size:30px;font-weight:700;line-height:1.15;display:none;touch-action:none}
.ito.show{display:block}
.ito small{display:block;font-size:34px}
.ito.on{transform:translateY(6px);box-shadow:0 1px 0 var(--navy);filter:brightness(1.15)}
#btnL{left:calc(env(safe-area-inset-left,0px) + 28px);background:var(--left)}
#btnR{right:calc(env(safe-area-inset-right,0px) + 28px);background:var(--right)}
#btnA{right:calc(env(safe-area-inset-right,0px) + 28px);background:var(--sun);font-size:40px}
@media (prefers-reduced-motion: no-preference){
  .ito.call{animation:call .7s ease-in-out infinite}
  @keyframes call{0%,100%{box-shadow:0 7px 0 var(--navy),0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 7px 0 var(--navy),0 0 0 16px rgba(255,255,255,0)}}
}
.ito.call{outline:5px solid #fff;outline-offset:4px}

#msg{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:56px;font-weight:700;color:#fff;pointer-events:none;opacity:0;
  -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;transition:opacity .25s}
#msg.show{opacity:1}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);max-width:88%;background:var(--paper);border:3px solid var(--navy);
  border-radius:16px;padding:10px 18px;font-size:20px;font-weight:700;line-height:1.5;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;white-space:pre-line}
#hint.show{opacity:1}
#ver{position:fixed;right:8px;bottom:4px;font-size:11px;opacity:.55;pointer-events:none}

/* overlays */
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.overlay.show{display:flex}
#title{background:linear-gradient(180deg,rgba(150,215,245,.9),rgba(190,232,250,.8) 55%,rgba(255,253,244,.94))}
.logo{position:relative;margin:0 0 6px;font-size:clamp(48px,9vw,88px);font-weight:700;letter-spacing:.04em;color:#fff;-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;line-height:1.1}
.thread{position:absolute;left:14%;bottom:88%;width:4px;height:60vh;background:#fff;border-left:1px solid rgba(29,43,83,.3);transform-origin:50% 0}
@media (prefers-reduced-motion: no-preference){ .thread{animation:sway 3.2s ease-in-out infinite} @keyframes sway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}} }
.lead{font-size:22px;font-weight:700;margin:0 0 22px;background:var(--paper);border:3px solid var(--navy);border-radius:999px;padding:6px 20px}
.stages{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1100px}
.stage{width:170px;min-height:160px;border:4px solid var(--navy);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--navy);padding:0 0 12px;text-align:center;overflow:hidden}
.stage:active{transform:translateY(5px);box-shadow:0 2px 0 var(--navy)}
.stage .band{height:58px;font-size:34px;line-height:58px;border-bottom:4px solid var(--navy)}
.stage[data-stage=practice1] .band{background:var(--p1)}
.stage[data-stage=practice2] .band{background:var(--p2)}
.stage[data-stage=forest] .band{background:var(--forest)}
.stage[data-stage=sky] .band{background:var(--city)}
.stage[data-stage=grass] .band{background:var(--grass)}
.stage .nm{display:block;font-size:22px;font-weight:700;margin:10px 0 2px}
.stage .lv{display:block;font-size:16px;font-weight:700;letter-spacing:.06em}
.stage .ds{display:block;font-size:14px;margin-top:6px;padding:0 8px;line-height:1.5}
.divider{width:4px;align-self:stretch;background:rgba(29,43,83,.25);border-radius:2px;margin:6px 4px}

#help{background:rgba(29,43,83,.5)}
#result{background:rgba(29,43,83,.45)}
.card{background:var(--paper);border:5px solid var(--navy);border-radius:26px;padding:22px 30px;text-align:center;box-shadow:0 9px 0 var(--navy);min-width:300px;max-width:900px}
.card h2{margin:0 0 6px;font-size:40px}
.steps{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.step{width:180px;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:8px 8px 10px}
.step svg{width:100%;height:110px;display:block}
.step p{margin:4px 0 0;font-size:18px;font-weight:700;line-height:1.45}
.num{display:inline-block;width:30px;height:30px;line-height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:18px;margin-right:4px}
.goalline{font-size:19px;font-weight:700;line-height:1.6;margin:0 0 16px;white-space:pre-line}
.stars{font-size:48px;letter-spacing:.06em;color:var(--sun);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;margin:4px 0}
.rtime{font-size:26px;font-weight:700;margin:0 0 18px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.big{min-height:64px;padding:0 24px;border-radius:18px;border:4px solid var(--navy);background:var(--sun);box-shadow:0 5px 0 var(--navy);font-size:22px;font-weight:700}
.big.sub{background:#fff}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
@media (max-height:700px){ .step svg{height:80px} .lead{margin-bottom:12px} }
@media (max-width:760px){ .stage{width:160px} .pill{font-size:16px;padding:5px 10px} .divider{display:none} }
</style>

import * as THREE from 'three';

let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* =========================================================
   ユーティリティ
   ========================================================= */

const wrapAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function mulberry32(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =========================================================
   手ざわり（全ステージ共通）。「ビョーン」の気持ちよさはここで調整
   ========================================================= */
const FEEL = {

  pullAccel: 38,      // 引っぱられるときの加速
  minPull: 0.35,      // ちょんと押しただけでも、最低この秒数は引っぱる
  hangGravity: 0.45,  // とんでいる途中、てっぺん付近の重力の倍率（ふわーっ）
  hangBand: 8,        // 上下の速さがこれより小さいと「てっぺん付近」

  pitchDeg: 42,       // 狙う向きの上向き角度

  itemRadius: 8,      // ★を取れる距離（ゆるめ）
};

/* ステージ設定（数値だけで調整できるようにまとめる） */
const STAGES = {
  practice1: {
    name: 'まっすぐ', mode: 'auto', lateralDamp: 1.5, walls: true, maxSpeed: 48, course: 'boulevard', seed: 5, L: 340, corridor: 16, items: 10,
    coneDeg: 55, rangeMin: 5, rangeMax: 75, idealDist: 30, gravityScale: 0.85, sway: false, swayAmp: 0,
    sky: 0xBFE6FA, ground: 0xB9D69C, next: 'practice2',
    helpTitle: 'れんしゅう 1　まっすぐ',
    helpGoal: 'ひだり・みぎは じどうで えらんで くれるよ。\n「おす → はなす」を くりかえして、ゴールまで とぼう！',
  },
  practice2: {
    name: 'ひだり・みぎ', mode: 'lr', lateralDamp: 1.0, walls: true, maxSpeed: 48, course: 'boulevard', targets: true, seed: 6, L: 460, corridor: 18, targetGap: 48, items: 0,
    coneDeg: 45, rangeMin: 5, rangeMax: 78, idealDist: 32, gravityScale: 0.85, sway: false, swayAmp: 0,
    sky: 0xE4DBFF, ground: 0xB9D69C, next: 'forest',

    coneDeg: 50, rangeMin: 9, rangeMax: 85, idealDist: 38, gravityScale: 0.85, sway: false, swayAmp: 0,
    sky: 0xA9DCF2, ground: 0x6FA35A, next: 'sky',

    sky: 0x8FD3F4, ground: 0x8CCB6A, next: 'grass',
    helpTitle: 'ふうせんのそら（ふつう）',

    coneDeg: 42, rangeMin: 4, rangeMax: 68, idealDist: 30, gravityScale: 1.0, sway: true, swayAmp: 0.08,
    sky: 0xF6E7B8, ground: 0x7B6A45, next: null,
    helpTitle: 'くさむら（むずかしい）',
    helpGoal: 'むしの おおきさに なって とぼう。\nくさは かぜで ゆれるから、いとの まとも うごくよ！',
  },
};
const PR = 0.8;
const MIN_ROPE = 5;
const SUBSTEPS = 4;

/* =========================================================
   レンダラー・シーン
   ========================================================= */
const canvas = document.getElementById('three');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8FD3F4, 110, 480);
scene.background = new THREE.Color(0x8FD3F4);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1600);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a70, 1.5));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
sunLight.position.set(60, 120, 40);
scene.add(sunLight);

const linesCanvas = document.getElementById('lines');
const lctx = linesCanvas.getContext('2d');
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  linesCanvas.width = w; linesCanvas.height = h;

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const groundMat = new THREE.MeshLambertMaterial({ color: 0x9AA3AE });
groundMat.map = canvasTex(64, 64, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32); });
groundMat.map.wrapS = groundMat.map.wrapT = THREE.RepeatWrapping; groundMat.map.repeat.set(140, 140);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2800, 2800), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* =========================================================
   プレイヤー（オリジナルキャラ：手袋をした探検隊員）
   ========================================================= */
const player = new THREE.Group();
const arms = {};   // 1 = ひだり手, -1 = みぎ手
{
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const suit = M(0x2E6FD8), skin = M(0xF2C9A0), helm = M(0xFF8A1F), glove = M(0xFFFFFF), brown = M(0x8A5A2B), dark = M(0x1D2B53);
  player.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.55, 4, 10), suit));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), skin); head.position.y = 0.72; player.add(head);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), helm); helmet.position.y = 0.76; player.add(helmet);
  const goggle = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.12), dark); goggle.position.set(0, 0.78, 0.25); player.add(goggle);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.26), brown); pack.position.set(0, 0.08, -0.36); player.add(pack);
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.42, 4, 8), suit); leg.position.set(0.17 * sx, -0.68, 0); player.add(leg);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.34), dark); boot.position.set(0.17 * sx, -1.0, 0.05); player.add(boot);
    // 腕（肩を支点に回す）。キャラの左手はローカル +x 側
    const pivot = new THREE.Group(); pivot.position.set(0.46 * sx, 0.38, 0);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.45, 4, 8), suit); arm.position.y = -0.33; pivot.add(arm);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), glove); gl.position.y = -0.68; pivot.add(gl);

  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 400; windFilter.Q.value = 0.8;
  windGain = AC.createGain(); windGain.gain.value = 0;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master); src.start();
  if (AC.state === 'suspended') AC.resume();
}
function noiseBurst(dur, type, f0, f1, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0, f1 = null) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfxShoot = () => noiseBurst(0.14, 'highpass', 1500, 6000, 0.5);
const sfxAttach = () => { tone(200, 0.07, 'triangle', 0.3, 0, 90); tone(180, 0.32, 'sine', 0.22, 0.03, 620); };   // ビョーン
const sfxBoing = () => tone(300, 0.25, 'sine', 0.3, 0, 120);
const sfxMiss = () => noiseBurst(0.22, 'bandpass', 3000, 700, 0.25);
const sfxRelease = () => noiseBurst(0.35, 'bandpass', 400, 2000, 0.35);
const sfxBounce = () => tone(140, 0.15, 'sine', 0.35, 0, 60);
const sfxItem = () => { tone(1175, 0.1, 'triangle', 0.22); tone(1568, 0.16, 'triangle', 0.22, 0.07); };
const sfxGoal = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.25, i * 0.12));
function updateWind(sp) {
  if (!AC || !windGain) return;
  const t = AC.currentTime;
  windGain.gain.setTargetAtTime(state === 'playing' ? clamp((sp - 5) / 50, 0, 1) * 0.35 : 0, t, 0.1);
  windFilter.frequency.setTargetAtTime(300 + sp * 25, t, 0.1);
}
window.addEventListener('pointerdown', initAudio, { passive: true });

/* =========================================================
   説明画面（図で示す）
   ========================================================= */
const $ = id => document.getElementById(id);
function btnSvg(color, label) {
  return `<circle cx="50" cy="62" r="30" fill="${color}" stroke="#1D2B53" stroke-width="4"/><text x="50" y="69" text-anchor="middle" font-size="17" font-weight="700" fill="#1D2B53">${label}</text>`;
}
function manSvg(x, y, rot = 0) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><circle cx="0" cy="-14" r="7" fill="#F2C9A0" stroke="#1D2B53" stroke-width="2"/><path d="M-7 -16 a7 7 0 0 1 14 0z" fill="#FF8A1F"/><rect x="-6" y="-7" width="12" height="16" rx="5" fill="#2E6FD8" stroke="#1D2B53" stroke-width="2"/></g>`;
}
function helpHTML() {
  const auto = D.mode === 'auto';
  const b = auto ? btnSvg('#FFC93C', 'いと') : btnSvg('#4DB6F0', 'ひだり');
  const step1 = `<svg viewBox="0 0 200 110">${b.replace(/cx="50"/g, 'cx="45"').replace(/x="50"/g, 'x="45"')}<path d="M95 58 l14 0 m-6 -7 l7 7 -7 7" stroke="#1D2B53" stroke-width="4" fill="none"/><line x1="140" y1="84" x2="185" y2="18" stroke="#fff" stroke-width="4"/><line x1="140" y1="84" x2="185" y2="18" stroke="#1D2B53" stroke-width="1" stroke-dasharray="3 3"/><circle cx="185" cy="18" r="8" fill="none" stroke="${auto ? '#FFC93C' : '#4DB6F0'}" stroke-width="4"/>${manSvg(140, 92)}</svg>`;
  const step2 = `<svg viewBox="0 0 200 110"><circle cx="100" cy="12" r="6" fill="#1D2B53"/><line x1="100" y1="12" x2="130" y2="80" stroke="#1D2B53" stroke-width="3"/><path d="M40 70 Q100 118 160 70" stroke="#1D2B53" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M160 70 l-12 -1 m12 1 l-4 11" stroke="#1D2B53" stroke-width="3" fill="none"/>${manSvg(132, 90, -25)}</svg>`;
  const step3 = `<svg viewBox="0 0 200 110"><path d="M20 95 Q90 -10 185 40" stroke="#1D2B53" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M185 40 l-13 -5 m13 5 l-9 10" stroke="#1D2B53" stroke-width="3" fill="none"/>${manSvg(110, 30, 50)}<text x="40" y="40" font-size="22" font-weight="700" fill="#FF6B8A">ビューン</text></svg>`;
  let s = `<div class="step">${step1}<p><span class="num">1</span>ボタンを おす<br>→ いとが でる</p></div>
           <div class="step">${step2}<p><span class="num">2</span>ぐいっと<br>ひっぱられる</p></div>
           <div class="step">${step3}<p><span class="num">3</span>はなす<br>→ ふわーっと とぶ</p></div>`;
  if (!auto) {
    s += `<div class="step"><svg viewBox="0 0 200 110">${btnSvg('#4DB6F0', 'ひだり').replace(/cx="50"/g, 'cx="48"').replace(/x="50"/g, 'x="48"')}${btnSvg('#FF9F43', 'みぎ').replace(/cx="50"/g, 'cx="152"').replace(/x="50"/g, 'x="152"')}<text x="100" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1D2B53">まとの ある ほう</text></svg><p>ひだりの まとは<br>「ひだり」ボタン</p></div>`;
  }
  return s;
}
function openHelp(first) {
  resumeTo = first ? 'start' : 'playing';
  $('helpTitle').textContent = D.helpTitle;
  $('helpSteps').innerHTML = helpHTML();
  $('helpGoal').textContent = D.helpGoal;
  $('btnStart').textContent = first ? 'はじめる' : 'つづける';
  $('help').classList.add('show');
  state = 'help';
  R.holding = false; if (R.phase !== 'none') R.phase = 'none';
  document.querySelectorAll('.ito').forEach(b => b.classList.remove('on'));
}

/* =========================================================
   進行
   ========================================================= */
let msgTimer = 0, hintTimer = 0;
function flash(text, ms) { const m = $('msg'); m.textContent = text; m.classList.add('show'); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('show'), ms); }
function hint(text, ms) { const m = $('hint'); m.textContent = text; m.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => m.classList.remove('show'), ms); }

function resetPlayer() {
  P.pos.set(0, PR, 0); P.vel.set(0, 0, 0); P.grounded = true;
  R.phase = 'none'; R.anchor = null; R.holding = false; R.button = null; R.hand = -1; R.lastSide = -1;
  yaw = 0;
  camera.position.set(0, 5, -11); _lookCur.set(0, 2, 8); camera.fov = 70;
  player.quaternion.identity();
}
function setControls(show) {
  const auto = D.mode === 'auto';
  $('btnL').classList.toggle('show', show && !auto);
  $('btnR').classList.toggle('show', show && !auto);
  $('btnA').classList.toggle('show', show && auto);
}
function prepareStage(id) {
  buildWorld(id);
  resetPlayer();
  playTime = 0; finished = false; itemsGot = 0; targetIndex = 0;
  $('title').classList.remove('show'); $('result').classList.remove('show');
  $('hud').classList.add('show'); $('btnQuit').classList.add('show'); $('btnHelp').classList.add('show');
  $('hudStage').textContent = D.name;
  $('hudItem').style.display = (D.items || D.targets) ? '' : 'none';
  setControls(true);
  updateHud();
  openHelp(true);
}
function beginPlay() {
  $('help').classList.remove('show');
  state = 'playing';
  if (resumeTo === 'start') { flash('スタート！', 900); }
  refreshTargets();
}
function startStage(id) { prepareStage(id); beginPlay(); }   // テスト用（説明を飛ばす）
function finish() {
  finished = true; sfxGoal();
  state = 'result';
  R.phase = 'none'; R.holding = false;
  const t = playTime;
  if (D.targets) $('rItems').textContent = `まと ${targetsHit()} / ${world.targets.length}`;
  else if (D.items) $('rItems').textContent = `★ ${itemsGot} / ${world.items.length}`;
  else $('rItems').textContent = '★★★';
  $('rTime').textContent = `タイム ${t.toFixed(1)} びょう`;
  G.lastResult = { time: t, items: itemsGot, targets: targetsHit() };
  $('btnNext').style.display = D.next ? '' : 'none';
  $('btnRetry').classList.toggle('sub', !!D.next);
  setControls(false); refreshTargets();
  setTimeout(() => { if (state === 'result') $('result').classList.add('show'); }, 500);
}
function targetsHit() { return world.targets.filter(a => a.hit).length; }
function toTitle() {
  state = 'title';
  R.phase = 'none'; R.holding = false;
  ['result', 'help', 'hud'].forEach(id => $(id).classList.remove('show'));
  $('btnQuit').classList.remove('show'); $('btnHelp').classList.remove('show');
  setControls(false);
  $('title').classList.add('show');
}
function updateHud() {
  $('hudTime').textContent = `${playTime.toFixed(1)} びょう`;
  $('hudGoal').textContent = `ゴールまで ${Math.max(0, Math.round(world.L - P.pos.z))}m`;
  if (D.targets) $('hudItem').textContent = `まと ${targetsHit()}/${world.targets.length}`;
  else $('hudItem').textContent = `★ ${itemsGot}/${world.items.length}`;
}

document.querySelectorAll('.stage').forEach(b => b.addEventListener('click', () => { initAudio(); prepareStage(b.dataset.stage); }));
$('btnStart').addEventListener('click', () => { initAudio(); beginPlay(); });
$('btnRetry').addEventListener('click', () => prepareStage(stageId));
$('btnNext').addEventListener('click', () => { if (D.next) prepareStage(D.next); });
$('btnMenu').addEventListener('click', toTitle);
$('btnQuit').addEventListener('click', toTitle);
$('btnHelp').addEventListener('click', () => { if (state === 'playing') openHelp(false); });

/* =========================================================
   入力（タッチ・マウス・キーボード）
   ========================================================= */
function bindIto(el, button) {
  let pid = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    if (pid !== null) return;
    pid = e.pointerId; try { el.setPointerCapture(pid); } catch (_) {}
    el.classList.add('on'); shoot(button);
  });
  const up = e => { if (e.pointerId !== pid) return; pid = null; el.classList.remove('on'); release(button); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, up));
}
bindIto($('btnL'), 1); bindIto($('btnR'), -1); bindIto($('btnA'), 0);
const KEYMAP = { ArrowLeft: 1, KeyA: 1, ArrowRight: -1, KeyD: -1, Space: 0 };
window.addEventListener('keydown', e => {
  if (e.repeat || !(e.code in KEYMAP)) return;
  e.preventDefault(); initAudio();
  let b = KEYMAP[e.code];
  if (D.mode === 'auto') b = 0; else if (b === 0) return;
  shoot(b);
});
window.addEventListener('keyup', e => {
  if (!(e.code in KEYMAP)) return;
  let b = KEYMAP[e.code];
  if (D.mode === 'auto') b = 0; else if (b === 0) return;
  release(b);
});

/* =========================================================
   テスト用フック（Playwright検証用）
   ※ プレイヤーは内部の P.pos / P.vel で駆動。player(mesh).position は表示用の追従のみ
   ========================================================= */
const G = window.__G = {
  frames: 0, elapsed: 0, dtScale: 1,
  get state() { return state; },
  get stageId() { return stageId; },
  get stage() { return D; },
  FEEL,
  player: P, rope: R,
  get targets() { return tg; },
  get itemsGot() { return itemsGot; },
  get itemsTotal() { return world ? world.items.length : 0; },
  get targetIndex() { return targetIndex; },
  get targetsTotal() { return world ? world.targets.length : 0; },
  get goalZ() { return world ? world.L : 0; },
  get playTime() { return playTime; },
  get anchorCount() { return world ? world.anchors.length : 0; },
  get yaw() { return yaw; },
  camera, lastResult: null,
  api: {
    startStage, prepareStage, beginPlay, toTitle,
    shoot: (b = 0) => shoot(b), release: (b) => release(b),
    setPos: (x, y, z) => { P.pos.set(x, y, z); },
    setVel: (x, y, z) => { P.vel.set(x, y, z); },
    setYaw: a => { yaw = a; },
    currentTarget: () => world && world.targets[targetIndex] ? { side: world.targets[targetIndex].side, z: world.targets[targetIndex].z } : null,
    // 描画せずに早送り（テスト用）
    simulate: (sec, cb) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { if (cb) cb(G); stepGame(1 / 60); } },
  },
};

/* =========================================================
   メインループ（dtは1/30でクランプ＝dtScale方式）
   ========================================================= */
buildWorld('forest');
resetPlayer();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let raw = (now - last) / 1000; last = now;
  if (!(raw > 0)) raw = 1 / 60;
  const dt = Math.min(raw, 1 / 30);
  G.dtScale = dt * 60;
  G.frames++;
  stepGame(dt);
  updateWind(P.vel.length());
  renderer.render(scene, camera);
}
function stepGame(dt) {
  if (state === 'help') { lctx.clearRect(0, 0, linesCanvas.width, linesCanvas.height); return; }   // 説明中は一時停止
  G.elapsed += dt;
  if (D.sway) updateSway(G.elapsed);
  if (D.bob) updateBalloons(G.elapsed);
  if (state === 'playing') {
    if (!finished) playTime += dt;
    const hs = Math.hypot(P.vel.x, P.vel.z);
    if (!P.grounded && hs > 4) yaw += clamp(wrapAng(Math.atan2(P.vel.x, P.vel.z) - yaw), -FEEL.turnFollow * dt, FEEL.turnFollow * dt);
    yaw += clamp(wrapAng(0 - yaw), -FEEL.goalPull * dt, FEEL.goalPull * dt);
    updateTargets();
    updateRope(dt);
    physics(dt);
    updateItems(dt);
    updateHud();
    updateVisuals(dt);
  } else if (state === 'result') {
    tg[1] = tg[-1] = tg[0] = null;
    physics(dt);
    updateVisuals(dt);
  } else {
    tg[1] = tg[-1] = tg[0] = null;
    const a = G.elapsed * 0.08;
    camera.position.set(Math.sin(a) * 90, 70, 150 + Math.cos(a) * 90);
    camera.fov = 60; camera.updateProjectionMatrix();
    camera.lookAt(0, 30, 200);
    player.position.copy(P.pos);
    Object.values(reticles).forEach(r => r.visible = false);
    arrow.visible = ropeMesh.visible = false;
    lctx.clearRect(0, 0, linesCanvas.width, linesCanvas.height);
  }
}
requestAnimationFrame(loop);
</script>
