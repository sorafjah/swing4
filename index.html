<style>
:root{
  --navy:#1D2B53; --sun:#FFC93C; --sky:#8FD3F4; --silk:#FFFFFF;
  --forest:#56B26A; --city:#6F8FC9; --grass:#E0A63A; --paper:#FFFDF4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--sky);color:var(--navy);
  font-family:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif}
body{position:fixed;inset:0}
#three{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:inherit;color:var(--navy);touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:none;justify-content:center;gap:10px;pointer-events:none;padding:0 76px}
#hud.show{display:flex}
.pill{background:var(--paper);border:3px solid var(--navy);border-radius:999px;padding:6px 16px;font-size:20px;font-weight:700;white-space:nowrap}
#btnQuit{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);min-width:60px;height:48px;
  border-radius:14px;border:3px solid var(--navy);background:var(--paper);font-size:17px;font-weight:700;display:none}
#btnQuit.show{display:block}

/* controls */
#controls{display:none}
#controls.show{display:block}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.35);border:4px solid var(--navy);touch-action:none}
#stick::before,#stick::after{content:"";position:absolute;top:50%;margin-top:-10px;border:10px solid transparent}
#stick::before{left:8px;border-right-color:var(--navy)}
#stick::after{right:8px;border-left-color:var(--navy)}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#fff;border:4px solid var(--navy);pointer-events:none}
#btnIto{position:fixed;right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:140px;height:140px;border-radius:50%;
  background:var(--sun);border:5px solid var(--navy);box-shadow:0 7px 0 var(--navy);font-size:36px;font-weight:700;touch-action:none}
#btnIto.on{transform:translateY(6px);box-shadow:0 1px 0 var(--navy);background:#fff}
#btnMaki{position:fixed;right:calc(env(safe-area-inset-right,0px) + 186px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:96px;height:96px;border-radius:50%;
  background:#fff;border:4px solid var(--navy);box-shadow:0 5px 0 var(--navy);font-size:18px;font-weight:700;touch-action:none}
#btnMaki.on{transform:translateY(4px);box-shadow:0 1px 0 var(--navy);background:var(--sun)}
#btnMaki.hide{display:none}

#msg{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:56px;font-weight:700;color:#fff;pointer-events:none;opacity:0;
  -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;transition:opacity .25s}
#msg.show{opacity:1}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);max-width:88%;background:var(--paper);border:3px solid var(--navy);
  border-radius:16px;padding:10px 18px;font-size:20px;font-weight:700;line-height:1.5;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#hint.show{opacity:1}
#hint{white-space:pre-line}

/* overlays */
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay.show{display:flex}
#title{background:linear-gradient(180deg,rgba(150,215,245,.88),rgba(190,232,250,.78) 55%,rgba(255,253,244,.92))}
.logo{position:relative;margin:0 0 6px;font-size:clamp(52px,10vw,92px);font-weight:700;letter-spacing:.04em;color:#fff;-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;line-height:1.1}
.thread{position:absolute;left:14%;bottom:88%;width:4px;height:60vh;background:#fff;border-left:1px solid rgba(29,43,83,.3);transform-origin:50% 0}
.lead{font-size:22px;font-weight:700;margin:0 0 26px;background:var(--paper);border:3px solid var(--navy);border-radius:999px;padding:6px 20px}
.stages{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.stage{width:230px;min-height:170px;border:4px solid var(--navy);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--navy);padding:0 0 14px;text-align:center;overflow:hidden}
.stage:active{transform:translateY(5px);box-shadow:0 2px 0 var(--navy)}
.stage .band{height:64px;font-size:40px;line-height:64px;border-bottom:4px solid var(--navy)}
.stage[data-stage=forest] .band{background:var(--forest)}
.stage[data-stage=city] .band{background:var(--city)}
.stage[data-stage=grass] .band{background:var(--grass)}
.stage .nm{display:block;font-size:28px;font-weight:700;margin:10px 0 2px}
.stage .lv{display:block;font-size:18px;font-weight:700;letter-spacing:.1em}
.stage .ds{display:block;font-size:15px;margin-top:6px;padding:0 10px;line-height:1.5}
.how{margin-top:26px;font-size:18px;line-height:1.7;text-align:center;background:rgba(255,253,244,.9);border-radius:16px;padding:10px 20px}

#result{background:rgba(29,43,83,.45)}
.card{background:var(--paper);border:5px solid var(--navy);border-radius:26px;padding:26px 34px;text-align:center;box-shadow:0 9px 0 var(--navy);min-width:300px}
.card h2{margin:0;font-size:52px}
.stars{font-size:64px;letter-spacing:.1em;color:var(--sun);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;margin:6px 0}
.rtime{font-size:28px;font-weight:700;margin:0 0 20px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.big{min-height:64px;padding:0 24px;border-radius:18px;border:4px solid var(--navy);background:var(--sun);box-shadow:0 5px 0 var(--navy);font-size:22px;font-weight:700}
.big.sub{background:#fff}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
@media (prefers-reduced-motion: no-preference){
  .thread{animation:sway 3.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
}
@media (max-width:760px){ .stage{width:200px} .pill{font-size:17px;padding:5px 12px} }
</style>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   iPad 対策（ダブルタップ・ピンチ・バウンス防止）
   ========================================================= */
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

  },

    name: 'くさむら', level: 'むずかしい', seed: 37,
    gravityScale: 1.0, coneDeg: 28, rangeMin: 4, rangeMax: 60, idealDist: 28,
    autoReel: false, autoReelTo: 0, reelSpeed: 11, reelAccel: 18,
    swingAssist: 5, airSteer: 1.4, releaseBoost: 2, maxSpeed: 62,
    rings: 12, ringR: 5.5, ringGap: 66, ringYMin: 16, ringYMax: 38,
    sway: true, swayAmp: 0.09, star3: 70, star2: 140,
    sky: 0xF6E7B8, ground: 0x7B6A45,
  },
};
const PR = 0.8;          // プレイヤーの当たり判定半径
const GRAVITY = 22;      // 基本重力（m/s^2）
const MIN_ROPE = 5;      // 糸の最短長

const canvas = document.getElementById('three');

/* 地面（ステージ共通） */
const groundMat = new THREE.MeshLambertMaterial({ color: 0x9AA3AE });
{
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(120, 120);
  tex.colorSpace = THREE.SRGBColorSpace;
  groundMat.map = tex;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* =========================================================
   プレイヤー（オリジナルキャラ：手袋をした探検隊員）
   ========================================================= */
const player = new THREE.Group();
const handTip = new THREE.Object3D();
const armPivot = new THREE.Group();
{
  const suit = new THREE.MeshLambertMaterial({ color: 0x2E6FD8 });
  const skin = new THREE.MeshLambertMaterial({ color: 0xF2C9A0 });
  const helm = new THREE.MeshLambertMaterial({ color: 0xFF8A1F });
  const glove = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
  const brown = new THREE.MeshLambertMaterial({ color: 0x8A5A2B });
  const dark = new THREE.MeshLambertMaterial({ color: 0x1D2B53 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.55, 4, 10), suit);
  player.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), skin); head.position.y = 0.72; player.add(head);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), helm); helmet.position.y = 0.76; player.add(helmet);
  const goggle = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.12), dark); goggle.position.set(0, 0.78, 0.25); player.add(goggle);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.26), brown); pack.position.set(0, 0.08, -0.36); player.add(pack);
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.42, 4, 8), suit); leg.position.set(0.17 * sx, -0.68, 0); player.add(leg);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.34), dark); boot.position.set(0.17 * sx, -1.0, 0.05); player.add(boot);
  }
  const larm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.45, 4, 8), suit); larm.position.set(0.5, 0.05, 0); larm.rotation.z = 0.25; player.add(larm);
  const lglove = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), glove); lglove.position.set(0.6, -0.28, 0); player.add(lglove);
  // 右腕（糸を出す腕）。肩を支点に回転
  armPivot.position.set(-0.46, 0.38, 0);
  const rarm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.45, 4, 8), suit); rarm.position.y = -0.33; armPivot.add(rarm);
  const rglove = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), glove); rglove.position.y = -0.68; armPivot.add(rglove);
  handTip.position.y = -0.8; armPivot.add(handTip);
  player.add(armPivot);
}
scene.add(player);

/* 足もとの影（高さが分かるように） */
const blob = new THREE.Mesh(new THREE.CircleGeometry(1, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; scene.add(blob);

/* 糸 */
const ropeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1, 6, 1, true), new THREE.MeshBasicMaterial({ color: 0xffffff }));
ropeMesh.visible = false; scene.add(ropeMesh);

/* 照準マーカー */
const reticle = new THREE.Mesh(new THREE.TorusGeometry(1, 0.16, 8, 28), new THREE.MeshBasicMaterial({ color: 0xFFC93C, depthTest: false, transparent: true, opacity: 0.95 }));
reticle.renderOrder = 10; reticle.visible = false; scene.add(reticle);
const reticleDot = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), new THREE.MeshBasicMaterial({ color: 0x1D2B53, depthTest: false }));
reticleDot.renderOrder = 11; reticle.add(reticleDot);

/* 次のリングを指す矢印 */
const arrowGeo = new THREE.ConeGeometry(0.42, 1.3, 14); arrowGeo.rotateX(Math.PI / 2);
const arrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: 0xFFC93C, depthTest: false }));
arrow.renderOrder = 9; arrow.visible = false; scene.add(arrow);

/* =========================================================
   ゲーム状態
   ========================================================= */
const P = { pos: new V3(0, PR, 0), vel: new V3(), grounded: true };
const R = { phase: 'none', anchor: null, anchorPos: new V3(), length: 0, t: 0, dur: 0, missDir: new V3(), holding: false };
const input = { stickX: 0, stickY: 0, reel: false };
let D = DIFFICULTY.city;
let stageId = 'city';
let state = 'title';
let yaw = 0;
let world = null;
let currentTarget = null;
let ringIndex = 0;
let playTime = 0;
let finished = false;

/* =========================================================
   ステージ生成
   ========================================================= */
function disposeWorld() {
  if (!world) return;
  scene.remove(world.group);
  world.group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
  world = null;
}
function nearRing(W, x, z, m) {
  for (const r of W.rings) { const dx = r.c.x - x, dz = r.c.z - z; if (dx * dx + dz * dz < m * m) return true; }
  return false;
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new V3(), _p = new V3(), _e = new THREE.Euler(), _col = new THREE.Color();
const UP = new V3(0, 1, 0);

function buildWorld(id) {
  disposeWorld();
  stageId = id; D = DIFFICULTY[id];
  const rnd = mulberry32(D.seed);
  const W = { group: new THREE.Group(), boxes: [], segs: [], stalks: [], anchors: [], rings: [], L: 0, stalkMesh: null, flowerMesh: null, flowers: [] };
  world = W;
  scene.add(W.group);
  scene.background.setHex(D.sky); scene.fog.color.setHex(D.sky);
  groundMat.color.setHex(D.ground);

  // コース（リング）
  let x = 0, z = 0;
  const pts = [];
  for (let i = 0; i < D.rings; i++) {
    z += D.ringGap * (0.85 + rnd() * 0.3);
    x = clamp(x + (rnd() * 2 - 1) * 26, -45, 45);
    pts.push(new V3(x, lerp(D.ringYMin, D.ringYMax, rnd()), z));
  }
  W.L = z;
  const torus = new THREE.TorusGeometry(D.ringR, 0.45, 8, 44);
  pts.forEach((c, i) => {
    const prev = i > 0 ? pts[i - 1] : new V3(0, PR, 0);
    const next = i < pts.length - 1 ? pts[i + 1] : c.clone().add(new V3(0, 0, 10));
    const n = next.clone().sub(prev); n.y *= 0.3; n.normalize();
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x000000, transparent: true, opacity: 0.55 });
    const mesh = new THREE.Mesh(torus, mat);
    mesh.position.copy(c); mesh.lookAt(c.clone().add(n));
    W.group.add(mesh);
    W.rings.push({ c, n, mesh, passed: false });
  });

/* 草のゆれ（アンカーも一緒に動く） */

}
const _top = new V3();

  const gust = 0.65 + 0.35 * Math.sin(t * 0.35);
  W.stalks.forEach((s, i) => {
    s.tx = s.amp * gust * Math.sin(t * s.f + s.ph1);

    stalkPoint(f.s, f.s.h, _p); _q.setFromEuler(_e.set(f.s.tx, 0, f.s.tz)); _s.set(2.8, 1.3, 2.8); _m4.compose(_p, _q, _s);

function getAnchorPos(a, out) {

  return out.set(a.x, a.y, a.z);
}

   オートエイム：前方ななめ上の円錐内から最良の1点を選ぶ
   ========================================================= */

  const px = P.pos.x, py = P.pos.y, pz = P.pos.z;
  const nr = world.rings[ringIndex];
  const wantUp = nr && nr.c.y > py + 4;
  for (const a of world.anchors) {
    if (R.phase === 'attached' && a === R.anchor) continue;
    getAnchorPos(a, _ap);
    const vx = _ap.x - px, vy = _ap.y - py, vz = _ap.z - pz;
    if (vy < 2) continue;
    const d2 = vx * vx + vy * vy + vz * vz;

    const d = Math.sqrt(d2);

/* =========================================================
   糸の操作
   ========================================================= */
function shoot() {

}

/* =========================================================

/* =========================================================

  if (cur.distanceTo(r.c) < D.ringR * 0.8) hit = true;
  else {
    const s0 = _rp.subVectors(prev, r.c).dot(r.n), s1 = _rp.subVectors(cur, r.c).dot(r.n);
    if ((s0 < 0) !== (s1 < 0)) {
      const k = s0 / (s0 - s1);
      _rp.copy(prev).lerp(cur, k);
      if (_rp.distanceTo(r.c) < D.ringR + 0.5) hit = true;
    }
  }
  if (!hit) return;
  r.passed = true; r.mesh.visible = false;
  ringIndex++;
  if (ringIndex >= world.rings.length) { finish(); return; }
  sfxRing();
  flash('ナイス！', 700);
  refreshRings();
}
function refreshRings() {
  world.rings.forEach((r, i) => {
    const m = r.mesh.material;
    if (i === ringIndex) {
      const last = i === world.rings.length - 1;
      m.color.setHex(last ? 0xFF6B8A : 0xFFC93C); m.emissive.setHex(last ? 0x551122 : 0x553300); m.opacity = 1;
    } else { m.color.setHex(0xffffff); m.emissive.setHex(0x000000); m.opacity = 0.5; }
  });
}

/* =========================================================
   カメラ・見た目の更新
   ========================================================= */
const _camT = new V3(), _look = new V3(), _lookCur = new V3(), _hand = new V3(), _up = new V3(), _fw = new V3(), _rt = new V3(), _mb = new THREE.Matrix4(), _qb = new THREE.Quaternion();
let armRaise = 0;
function updateVisuals(dt) {
  const sp = P.vel.length();
  // 体の向き
  if (R.phase === 'attached' || R.phase === 'shooting') {
    getAnchorPos(R.anchor, R.anchorPos);
    _up.subVectors(R.anchorPos, P.pos).normalize();
  } else {
    _up.set(0, 1, 0);
    if (sp > 2) _up.addScaledVector(P.vel, Math.min(sp / 40, 1) * 0.8 / sp).normalize();
  }
  _fw.set(Math.sin(yaw), 0, Math.cos(yaw));
  _fw.addScaledVector(_up, -_fw.dot(_up));
  if (_fw.lengthSq() < 1e-4) _fw.set(0, 0, 1);
  _fw.normalize();
  _rt.crossVectors(_up, _fw).normalize();
  _mb.makeBasis(_rt, _up, _fw);
  _qb.setFromRotationMatrix(_mb);
  player.quaternion.slerp(_qb, 1 - Math.exp(-12 * dt));
  player.position.copy(P.pos);
  const raise = R.phase !== 'none' ? 1 : 0;
  armRaise = lerp(armRaise, raise, 1 - Math.exp(-25 * dt));
  armPivot.rotation.z = lerp(0.2, Math.PI * 0.98, armRaise);
  player.updateMatrixWorld(true);

  // 影
  blob.position.set(P.pos.x, 0.06, P.pos.z);
  const bs = clamp(1.4 - P.pos.y / 80, 0.35, 1.4); blob.scale.setScalar(bs);
  blob.material.opacity = clamp(0.3 - P.pos.y / 300, 0.08, 0.3);

  // 糸
  handTip.getWorldPosition(_hand);
  let end = null;
  if (R.phase === 'shooting') end = _p.copy(_hand).lerp(R.anchorPos, clamp(R.t / R.dur, 0, 1));
  else if (R.phase === 'attached') end = _p.copy(R.anchorPos);
  else if (R.phase === 'miss') {
    const k = R.t < 0.16 ? R.t / 0.16 : Math.max(0, 1 - (R.t - 0.16) / 0.16);
    end = _p.copy(_hand).addScaledVector(R.missDir, D.rangeMax * 0.6 * k);
  }
  if (end) {
    const len = _hand.distanceTo(end);
    if (len > 0.05) {
      ropeMesh.visible = true;
      ropeMesh.position.copy(_hand).add(end).multiplyScalar(0.5);
      _t.subVectors(end, _hand).divideScalar(len);
      ropeMesh.quaternion.setFromUnitVectors(UP, _t);
      ropeMesh.scale.set(1, len, 1);
    } else ropeMesh.visible = false;
  } else ropeMesh.visible = false;

  // カメラ
  const back = _fw.set(Math.sin(yaw), 0, Math.cos(yaw));
  _camT.copy(P.pos).addScaledVector(back, -11).add(_t.set(0, 4.5, 0));
  camera.position.lerp(_camT, 1 - Math.exp(-6 * dt));
  if (camera.position.y < 1.4) camera.position.y = 1.4;
  _look.copy(P.pos).addScaledVector(back, 8).add(_t.set(0, 2, 0));
  _lookCur.lerp(_look, 1 - Math.exp(-8 * dt));
  camera.lookAt(_lookCur);
  const fovT = 70 + clamp((sp - 15) / 40, 0, 1) * 20;
  camera.fov = lerp(camera.fov, fovT, 1 - Math.exp(-4 * dt));
  camera.updateProjectionMatrix();

  // 照準
  if (currentTarget && state === 'playing') {
    getAnchorPos(currentTarget, _ap);
    reticle.visible = true; reticle.position.copy(_ap);
    reticle.quaternion.copy(camera.quaternion);
    const dd = camera.position.distanceTo(_ap);
    reticle.scale.setScalar(0.5 + dd * 0.03 + Math.sin(G.elapsed * 8) * 0.06);
  } else reticle.visible = false;

  // 次のリングの矢印
  const nr = world && world.rings[ringIndex];
  if (nr && state === 'playing') {
    arrow.visible = true;
    arrow.position.copy(P.pos).add(_t.set(0, 2.4, 0));
    arrow.lookAt(nr.c);
    nr.mesh.scale.setScalar(1 + Math.sin(G.elapsed * 5) * 0.05);
  } else arrow.visible = false;

  drawSpeedLines(sp);
}

function drawSpeedLines(sp) {
  const w = linesCanvas.width, h = linesCanvas.height;
  lctx.clearRect(0, 0, w, h);
  if (state !== 'playing') return;
  const k = clamp((sp - 28) / 30, 0, 1);
  if (k <= 0) return;
  const cx = w / 2, cy = h / 2, diag = Math.hypot(w, h) / 2;
  lctx.strokeStyle = `rgba(255,255,255,${0.55 * k})`;
  lctx.lineWidth = 3;
  const n = Math.floor(10 + 20 * k);
  lctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r0 = diag * (0.62 + Math.random() * 0.2);
    lctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    lctx.lineTo(cx + Math.cos(a) * diag * 1.05, cy + Math.sin(a) * diag * 1.05);
  }
  lctx.stroke();
}

/* =========================================================
   音（Web Audio APIで合成）
   ========================================================= */
let AC = null, master = null, noiseBuf = null, windGain = null, windFilter = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 400; windFilter.Q.value = 0.8;
  windGain = AC.createGain(); windGain.gain.value = 0;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master); src.start();
}
function noiseBurst(dur, type, f0, f1, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0, f1 = null) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfxShoot = () => noiseBurst(0.14, 'highpass', 1500, 6000, 0.5);
const sfxAttach = () => tone(200, 0.09, 'triangle', 0.3, 0, 90);
const sfxMiss = () => noiseBurst(0.22, 'bandpass', 3000, 700, 0.25);
const sfxRelease = () => noiseBurst(0.3, 'bandpass', 400, 1800, 0.3);
const sfxBounce = () => tone(140, 0.15, 'sine', 0.35, 0, 60);
const sfxRing = () => { tone(880, 0.12, 'triangle', 0.25); tone(1320, 0.18, 'triangle', 0.25, 0.08); };
const sfxGoal = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.25, i * 0.12));
function updateWind(sp) {
  if (!AC || !windGain) return;
  const t = AC.currentTime;
  const g = state === 'playing' ? clamp((sp - 5) / 50, 0, 1) * 0.35 : 0;
  windGain.gain.setTargetAtTime(g, t, 0.1);
  windFilter.frequency.setTargetAtTime(300 + sp * 25, t, 0.1);
}
window.addEventListener('pointerdown', initAudio, { passive: true });

/* =========================================================
   画面・進行
   ========================================================= */
const $ = id => document.getElementById(id);
let msgTimer = 0, hintTimer = 0;
function flash(text, ms) { const m = $('msg'); m.textContent = text; m.classList.add('show'); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('show'), ms); }
function hint(text, ms) { const m = $('hint'); m.textContent = text; m.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => m.classList.remove('show'), ms); }

function resetPlayer() {
  P.pos.set(0, PR, 0); P.vel.set(0, 0, 0); P.grounded = true;
  R.phase = 'none'; R.anchor = null; R.holding = false;
  yaw = 0;
  camera.position.set(0, 5, -11); _lookCur.set(0, 2, 8); camera.fov = 70;
  player.quaternion.identity();
}
function startStage(id) {
  buildWorld(id);
  resetPlayer();
  ringIndex = 0; playTime = 0; finished = false;
  refreshRings();
  state = 'playing';
  $('title').classList.remove('show'); $('result').classList.remove('show');
  $('hud').classList.add('show'); $('controls').classList.add('show'); $('btnQuit').classList.add('show');
  $('btnMaki').classList.toggle('hide', D.autoReel);
  $('hudStage').textContent = D.name;
  flash('スタート！', 900);
  hint('「いと」を おしている あいだ ぶらさがる。\nはなすと とぶ！', 6000);
  updateHud();
}
function finish() {
  finished = true;
  sfxGoal();
  state = 'result';
  R.phase = 'none'; R.holding = false;
  const t = playTime;
  const stars = t <= D.star3 ? 3 : t <= D.star2 ? 2 : 1;
  $('rStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('rTime').textContent = `タイム ${t.toFixed(1)} びょう`;
  G.lastResult = { time: t, stars };
  $('controls').classList.remove('show');
  setTimeout(() => $('result').classList.add('show'), 500);
}
function toTitle() {
  state = 'title';
  R.phase = 'none'; R.holding = false;
  $('result').classList.remove('show'); $('hud').classList.remove('show'); $('controls').classList.remove('show'); $('btnQuit').classList.remove('show');
  $('title').classList.add('show');
}
function updateHud() {
  $('hudTime').textContent = `${playTime.toFixed(1)} びょう`;
  $('hudRing').textContent = `リング ${Math.min(ringIndex, world.rings.length)}/${world.rings.length}`;
}

document.querySelectorAll('.stage').forEach(b => b.addEventListener('click', () => { initAudio(); startStage(b.dataset.stage); }));
$('btnRetry').addEventListener('click', () => startStage(stageId));
$('btnMenu').addEventListener('click', toTitle);
$('btnQuit').addEventListener('click', toTitle);

/* =========================================================
   入力（タッチ・マウス・キーボード）
   ========================================================= */
const btnIto = $('btnIto'), btnMaki = $('btnMaki'), stick = $('stick'), knob = $('knob');
let itoPointer = null;
btnIto.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (itoPointer !== null) return;
  itoPointer = e.pointerId; try { btnIto.setPointerCapture(e.pointerId); } catch (_) {}
  btnIto.classList.add('on'); shoot();
});
const itoUp = e => { if (e.pointerId !== itoPointer) return; itoPointer = null; btnIto.classList.remove('on'); release(); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btnIto.addEventListener(ev, itoUp));

let makiPointer = null;
btnMaki.addEventListener('pointerdown', e => { e.preventDefault(); makiPointer = e.pointerId; try { btnMaki.setPointerCapture(e.pointerId); } catch (_) {} input.reel = true; btnMaki.classList.add('on'); });
const makiUp = e => { if (e.pointerId !== makiPointer) return; makiPointer = null; input.reel = false; btnMaki.classList.remove('on'); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btnMaki.addEventListener(ev, makiUp));

let stickPointer = null;
function moveStick(e) {
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
  let dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  knob.style.transform = `translate(${dx * 42}px,${dy * 42}px)`;
  input.stickX = Math.abs(dx) < 0.12 ? 0 : dx; input.stickY = Math.abs(dy) < 0.12 ? 0 : dy;
}
stick.addEventListener('pointerdown', e => { e.preventDefault(); stickPointer = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {} moveStick(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickPointer) moveStick(e); });
const stickUp = e => { if (e.pointerId !== stickPointer) return; stickPointer = null; input.stickX = input.stickY = 0; knob.style.transform = ''; };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => stick.addEventListener(ev, stickUp));

const keys = {};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); initAudio(); btnIto.classList.add('on'); shoot(); }
  if (e.code === 'KeyW' || e.code === 'ArrowUp') input.reel = true;
  syncKeyStick();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') { btnIto.classList.remove('on'); release(); }
  if (e.code === 'KeyW' || e.code === 'ArrowUp') input.reel = false;
  syncKeyStick();
});
function syncKeyStick() {
  if (stickPointer !== null) return;
  input.stickX = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
}

/* =========================================================
   テスト用フック（Playwright検証用）
   ※ プレイヤーは内部の P.pos / P.vel で駆動。player(mesh).position は表示用の追従のみ
   ========================================================= */
const G = window.__G = {
  frames: 0, elapsed: 0,
  get state() { return state; },
  get stageId() { return stageId; },
  get difficulty() { return D; },
  player: P,
  rope: R,
  get target() { return currentTarget; },
  get ringsPassed() { return ringIndex; },
  get ringsTotal() { return world ? world.rings.length : 0; },
  get playTime() { return playTime; },
  get anchorCount() { return world ? world.anchors.length : 0; },
  get yaw() { return yaw; },
  camera, lastResult: null,
  api: {
    startStage, shoot, release, toTitle,
    setReel: v => { input.reel = !!v; },
    setStick: (x, y = 0) => { input.stickX = x; input.stickY = y; },
    setPos: (x, y, z) => { P.pos.set(x, y, z); },
    setVel: (x, y, z) => { P.vel.set(x, y, z); },
    setYaw: a => { yaw = a; },
    ringCenter: i => world && world.rings[i] ? world.rings[i].c.clone() : null,
    anchorPos: a => a ? getAnchorPos(a, new V3()) : null,
    // 描画せずに早送りする（テスト用）。cb(G) を毎ステップ呼べる
    simulate: (sec, cb) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { if (cb) cb(G); stepGame(1 / 60); } },
  },
};

/* =========================================================
   メインループ（dtは1/30でクランプ＝dtScale方式）
   ========================================================= */
buildWorld('city');
resetPlayer();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let raw = (now - last) / 1000; last = now;
  if (!(raw > 0)) raw = 1 / 60;
  const dt = Math.min(raw, 1 / 30);
  G.dtScale = dt * 60;
  G.frames++;
  stepGame(dt);
  updateWind(P.vel.length());
  renderer.render(scene, camera);
}
function stepGame(dt) {
  G.elapsed += dt;
  if (D.sway) updateSway(G.elapsed);

  if (state === 'playing') {
    if (!finished) playTime += dt;
    yaw -= input.stickX * TURN_RATE * dt;
    const hs = Math.hypot(P.vel.x, P.vel.z);
    if (!P.grounded && hs > 6 && Math.abs(input.stickX) < 0.15) {
      yaw += clamp(wrapAng(Math.atan2(P.vel.x, P.vel.z) - yaw), -0.9 * dt, 0.9 * dt);
    }
    currentTarget = findTarget();
    updateRope(dt);
    const prevPos = P.pos.clone();
    physics(dt);
    checkRings(prevPos, P.pos);
    updateHud();
    updateVisuals(dt);
  } else if (state === 'result') {
    currentTarget = null;
    physics(dt);
    updateVisuals(dt);
  } else {
    // タイトル：街の上をゆっくり回るカメラ
    currentTarget = null;
    const a = G.elapsed * 0.08;
    camera.position.set(Math.sin(a) * 90, 70, 150 + Math.cos(a) * 90);
    camera.fov = 60; camera.updateProjectionMatrix();
    camera.lookAt(0, 30, 200);
    player.position.copy(P.pos);
    reticle.visible = arrow.visible = ropeMesh.visible = false;
    lctx.clearRect(0, 0, linesCanvas.width, linesCanvas.height);
  }
}
requestAnimationFrame(loop);
</script>
